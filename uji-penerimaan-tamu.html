<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src https://script.google.com https://*.googleusercontent.com https://accounts.google.com; base-uri 'none'; form-action 'none'">
  <title>Penerimaan Tamu | ARHANUD80</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background: #f2f6f3; color: #18374b; }
    .bar { min-height: 54px; display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 20px; background:#102d42; color:#fff; border-bottom:3px solid #c6ab70; }
    .title { font-size:13px; font-weight:750; letter-spacing:.02em; }
    .tools { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    a,button { font:inherit; cursor:pointer; }
    .tools a,.tools button { color:#fff; background:#ffffff18; border:1px solid #ffffff40; border-radius:7px; text-decoration:none; padding:6px 10px; font-size:12px; }
    .tools a:focus-visible,.tools button:focus-visible { outline:3px solid #e8cc88; outline-offset:2px; }
    .message { max-width:700px; margin:9vh auto; padding:26px; background:#fff; border:1px solid #dce8e1; border-radius:16px; box-shadow:0 12px 35px #18374b0d; }
    .message h1 { font-size:21px; margin:0 0 10px; }
    .message p { color:#58717d; }
    .message strong { color:#a23232; }
    iframe { display:block; width:100%; height:calc(100vh - 54px); min-height:560px; border:0; background:#f2f6f3; }
    [hidden] { display:none !important; }
    @media(max-width:600px) { .bar { padding:9px 12px; align-items:flex-start; flex-direction:column; gap:6px; } iframe { height:calc(100vh - 95px); } .message { margin:30px 14px; } }
  </style>
</head>
<body>
  <header class="bar"><span class="title">UJI FIKTIF · BUKAN UNTUK ACARA</span><div class="tools" id="tools" hidden><a id="open-app" target="_blank" rel="noopener noreferrer">Masuk & beri izin Google ↗</a><button id="reload-app" type="button">Muat ulang</button></div></header>
  <main>
    <section class="message" id="message" role="status"><h1>Aplikasi belum disiapkan</h1><p id="message-text">Pengelola perlu memasukkan alamat deployment proyek UJI yang baru. Halaman ini tidak berisi data tamu asli.</p></section>
    <iframe id="app" title="Aplikasi penerimaan tamu untuk petugas" referrerpolicy="no-referrer" hidden></iframe>
  </main>
  <script>
    (() => {
      'use strict';
      // PENGELOLA: isi hanya dengan URL /exec dari proyek Apps Script BARU yang
      // sudah diuji. URL ini bukan sandi. Jangan tempel data tamu atau token.
      const APP_URL = 'https://script.google.com/macros/s/AKfycbxsjV2kszSzBws-uZQM6HDGw2c5kcxnr7yEz6sQ6PaOykWmTRWpqUlvCmphFSEChSv7/exec';
      const frame = document.getElementById('app'), message = document.getElementById('message');
      const text = document.getElementById('message-text'), tools = document.getElementById('tools');
      // Do not load the app when this wrapper is itself embedded on another site.
      if (window.top !== window.self) {
        text.textContent = 'Untuk keamanan, buka alamat resmi langsung di browser.';
        return;
      }
      if (location.protocol !== 'https:') {
        text.textContent = 'HTTPS yang valid diperlukan. Jangan masukkan data atau kata sandi pada halaman HTTP; hubungi pengelola.';
        return;
      }
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(APP_URL)) {
        text.textContent = 'Alamat deployment Apps Script belum diisi atau tidak valid. Hubungi pengelola.';
        return;
      }
      // The sandboxed Apps Script page may be two frames down. A nonce-based
      // acknowledgement lets it verify this exact top-level origin in browsers
      // that do not provide location.ancestorOrigins. It carries no guest data.
      window.addEventListener('message', event => {
        if (!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/i.test(event.origin) || !event.source || !event.data ||
            event.data.type !== 'ARHANUD80_EMBED_HELLO' || typeof event.data.nonce !== 'string' ||
            !/^new-[0-9a-f-]{36}$/.test(event.data.nonce)) return;
        event.source.postMessage({type:'ARHANUD80_EMBED_ACK', nonce:event.data.nonce}, event.origin);
      });
      document.getElementById('open-app').href = APP_URL;
      document.getElementById('reload-app').addEventListener('click', () => { frame.src = APP_URL; });
      frame.src = APP_URL; frame.hidden = false; tools.hidden = false; message.hidden = true;
    })();
  </script>
</body>
</html>
